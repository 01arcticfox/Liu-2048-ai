<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>2048 AI · Blue</title>
<link rel="stylesheet" href="app.css?v=9" />
</head>
<body>
  <div class="bg-fx" aria-hidden="true">
    <span class="orb o1"></span>
    <span class="orb o2"></span>
    <span class="orb o3"></span>
    <span class="mesh"></span>
  </div>

  <main class="app">
    <div class="topline">
      <span class="chip" id="engineChip">C++ SOLVER · WEBVIEW</span>
      <div class="tools">
        <button class="icon-btn wide" id="speedBtn" title="AI Speed">1x</button>
        <button class="icon-btn" id="langBtn" title="Language">EN</button>
        <button class="icon-btn" id="themeBtn" title="Theme">☾</button>
      </div>
    </div>

    <header class="topbar">
      <div class="brand">
        <h1 class="logo">2048<span class="ai">AI</span></h1>
        <p class="sub" data-i18n="sub"></p>
      </div>
      <div class="scores">
        <div class="score-box" id="scoreBox">
          <span class="k" data-i18n="score"></span>
          <strong id="score">0</strong>
        </div>
        <div class="score-box">
          <span class="k" data-i18n="best"></span>
          <strong id="best">0</strong>
        </div>
      </div>
    </header>

    <section class="board-wrap">
      <div class="board" id="board">
        <div class="grid" id="grid"></div>
        <div class="tiles" id="tiles"></div>
        <div class="hint" id="hint"><span class="chev">➤</span></div>
        <div class="overlay" id="overlay" hidden>
          <div class="ov-card">
            <h2 id="ovTitle">GAME OVER</h2>
            <p id="ovText"></p>
            <button class="btn primary" id="ovBtn"></button>
          </div>
        </div>
      </div>
    </section>

    <div class="hud">
      <div class="hud-item ai">
        <span class="dot" id="aiDot"></span>
        <span id="aiState"></span>
      </div>
      <div class="hud-item" id="aiEval"></div>
      <div class="hud-item" id="maxTile"></div>
    </div>

    <div class="controls">
      <button class="btn primary" id="newGame" data-i18n="newGame"></button>
      <button class="btn" id="autoBtn">
        <span class="led" id="autoLed"></span><span data-i18n="auto"></span>
      </button>
      <button class="btn" id="hintBtn" data-i18n="hint"></button>
    </div>

    <p class="tips" data-i18n="tips"></p>
  </main>

  <div class="toast" id="toast"></div>

  <script src="engine.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
